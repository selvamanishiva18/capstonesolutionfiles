name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run tests
      - name: Run Tests
        run: npm test --if-present

      # 5. Build application
      - name: Build Application
        run: npm run build

      # 6. Deploy to Vercel (only when Vercel secrets are configured)
      #    Uses the official Vercel CLI at @latest so it always meets Vercel's
      #    minimum-version requirement. ORG/PROJECT ids are read from env.
      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest --prod --yes --token="$VERCEL_TOKEN"